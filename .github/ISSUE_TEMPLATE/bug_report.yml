name: Bug Report
description: Report a tool failure, RPC deserialization fault, or paywall verification error
title: "fix: <description>"
labels: ["bug", "triage"]
body:
  - type: input
    id: environment
    attributes:
      label: Environment
      placeholder: e.g. Node 22, Stellar Testnet Protocol 22, @stellar-mcp/server v0.1.0
    validations:
      required: true
  - type: input
    id: error_code
    attributes:
      label: Error Code & Slug (from 250 registry)
      placeholder: e.g. Code 1043 (ERR_HORIZON_SEQUENCE_MISMATCH)
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Reproduction Steps
      description: Provide the exact tool parameters or x402 challenge flow.
      placeholder: 1. Start server with transport SSE\n2. Dispatch tool ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected vs Actual Result
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Server / Client Logs
      render: shell
